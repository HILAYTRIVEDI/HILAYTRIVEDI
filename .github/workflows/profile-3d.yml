name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * 0"   # weekly, Sundays 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-3d-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: HILAYTRIVEDI

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "No contribution changes detected."
            exit 0
          fi
          git commit -m "chore: update 3D contribution graph"
          git push
